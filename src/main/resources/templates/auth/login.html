<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tacna en Bici - Iniciar Sesión</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .login-sidebar {
            background: linear-gradient(135deg, #111111 0%, #1a1a1a 100%);
            width: 45%;
            padding: 60px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .login-sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("https://images.unsplash.com/photo-1511994298241-608e28f14fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80") center/cover;
            opacity: 0.15;
            z-index: 1;
        }

        .login-sidebar-content {
            position: relative;
            z-index: 2;
        }

        .login-form-area {
            width: 55%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #ffffff;
        }

        .login-form-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .form-control-custom {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 0.95rem;
            color: #111;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            background: #ffffff;
            border-color: #111111;
            box-shadow: 0 0 0 4px rgba(17, 17, 17, 0.1);
            outline: none;
        }

        .input-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555555;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login {
            background: #111111;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 14px 30px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: #2a2a2a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            color: #ffffff;
        }

        .btn-register {
            background: #ffffff;
            color: #111111;
            border: 1px solid #e0e0e0;
            border-radius: 50px;
            padding: 14px 30px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            background: #f8f9fa;
            border-color: #111111;
            color: #111111;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: #a0a0a0;
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        .back-link {
            position: absolute;
            top: 40px;
            right: 40px;
            color: #666;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
            z-index: 10;
        }

        .back-link:hover {
            color: #111;
        }

        @media (max-width: 991px) {
            .login-wrapper {
                flex-direction: column;
            }
            .login-sidebar {
                width: 100%;
                min-height: 350px;
                padding: 40px;
            }
            .login-form-area {
                width: 100%;
                padding: 40px 20px;
                min-height: calc(100vh - 350px);
            }
            .back-link {
                top: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">

    <!-- Panel Izquierdo / Imagen -->
    <div class="login-sidebar">
        <div class="login-sidebar-content" data-aos="fade-right" data-aos-duration="1000">
            <div class="d-flex align-items-center mb-4">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" class="me-2">
                    <circle cx="5.5" cy="17.5" r="3.5"></circle>
                    <circle cx="18.5" cy="17.5" r="3.5"></circle>
                    <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"></path>
                </svg>
                <span class="text-white fw-bold fs-6 tracking-wide">TACNA EN BICI</span>
            </div>
        </div>
        <div class="login-sidebar-content mt-5" data-aos="fade-right" data-aos-duration="1000" data-aos-delay="200">
            <h2 class="display-5 fw-bold mb-3">Únete a la red.</h2>
            <p class="text-white opacity-75 fs-5 lh-lg mb-0" style="max-width: 450px;">
                Accede a tu cuenta para reportar robos, consultar nuestra base de datos y proteger a la comunidad ciclista de Tacna.
            </p>
        </div>
    </div>

    <!-- Panel Derecho / Formulario -->
    <div class="login-form-area">

        <a th:href="@{/}" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Volver al inicio
        </a>

        <div class="login-form-container" data-aos="fade-up" data-aos-duration="800" data-aos-delay="100">
            <div class="mb-5">
                <h3 class="fw-bold fs-2 text-dark mb-2">Bienvenido de nuevo</h3>
                <p class="text-secondary">Ingresa tus credenciales para continuar</p>
            </div>

            <form th:action="@{/login}" th:object="${login}" method="post">

                <div class="mb-4">
                    <label class="input-label">Correo electrónico</label>
                    <input type="email" class="form-control w-100 form-control-custom" th:field="*{correo}" placeholder="tu@correo.com" required>
                </div>

                <div class="mb-4">
                    <label class="input-label">Contraseña</label>
                    <input type="password" class="form-control w-100 form-control-custom" th:field="*{password}" placeholder="••••••••" required>
                </div>

                <div th:if="${error}" class="alert alert-danger rounded-3 border-0 d-flex align-items-center p-3 mb-4" style="background-color: #fff0f0; color: #dc3545;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span th:text="${error}" class="small fw-bold"></span>
                </div>

                <button type="submit" class="btn btn-login w-100 mb-3 py-3">
                    Iniciar Sesión
                </button>

                <div class="divider">o</div>

                <a th:href="@{/usuarios/registro}" class="btn btn-register w-100 d-block text-center text-decoration-none py-3">
                    Crear una cuenta nueva
                </a>

            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({
        once: true,
        offset: 0
    });
</script>
</body>
</html>
