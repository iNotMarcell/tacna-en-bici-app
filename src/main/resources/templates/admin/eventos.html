<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tacna en Bici - Panel de Noticias</title>
  <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: #f5f7fa; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
    .dashboard-app { display: flex; width: 100%; height: 100%; }
    .sidebar { width: 280px; height:100%; background-color: #ffffff; border-right: 1px solid #eaedf2; padding: 45px 24px; display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background-color: #e0e0e0; border-radius: 10px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.5rem; color: #111; margin-bottom: 40px; padding: 0 10px; }
    .menu-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #888; font-weight: 600; margin-bottom: 15px; padding: 0 10px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; color: #555; text-decoration: none; font-weight: 500; margin-bottom: 5px; transition: all 0.3s; }
    .nav-item:hover { background-color: #f5f7fa; color: #111; }
    .nav-item.active { background-color: #111; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .support-card { background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%); border-radius: 20px; padding: 20px; color: #fff; margin-top: auto; text-align: center; }
    .main-content { flex: 1; padding: 40px 50px; overflow-y: auto; background-color: transparent; }
    .main-content::-webkit-scrollbar { width: 8px; }
    .main-content::-webkit-scrollbar-thumb { background-color: #cdd3db; border-radius: 10px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }

    .card-widget { background-color: #ffffff; border: 1px solid #eaedf2; border-radius: 24px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); margin-bottom: 40px; }
    .table-custom { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; }
    .table-custom th { color: #888; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; padding: 15px 20px; border-bottom: 1px solid #eaedf2; }
    .table-custom td { padding: 20px; vertical-align: middle; border-bottom: 1px solid #eaedf2; color: #333; font-weight: 500; }
    .table-custom tr:last-child td { border-bottom: none; }
    .table-custom tbody tr:hover { background-color: #f8f9fa; }

    @media (max-width: 768px) { body { overflow: auto; height: auto; } .dashboard-app { flex-direction: column; height: auto; } .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #eaedf2; padding: 20px; } .main-content { overflow-y: visible; padding: 20px; } .top-bar { flex-direction: column; align-items: flex-start; gap: 20px; } }
  </style>
</head>
<body>

<div class="dashboard-app">

  <div th:replace="~{fragments/admin-sidebar :: sidebar('eventos')}"></div>

  <main class="main-content">
    <header class="top-bar">
      <div>
        <h2 class="fw-bold fs-3 mb-1">Gestión de Noticias</h2>
        <p class="text-secondary small mb-0">Publica eventos, artículos y comunicados oficiales</p>
      </div>

      <a th:href="@{/admin/eventos/nuevo}" class="btn btn-dark rounded-pill px-4 fw-semibold py-2 d-flex align-items-center gap-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Redactar Noticia
      </a>
    </header>

    <div class="card-widget">
      <div class="table-responsive">
        <table class="table-custom">
          <thead>
          <tr>
            <th>Título</th>
            <th>Categoría</th>
            <th>Autor</th>
            <th>Fecha</th>
            <th class="text-end">Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="e : ${eventos}">
            <td>
              <div class="fw-bold text-dark text-truncate" style="max-width: 300px;" th:text="${e.titulo}"></div>
            </td>
            <td>
              <span class="badge bg-light text-dark border px-3 py-2 rounded-pill fw-medium" th:text="${e.categoria}"></span>
            </td>
            <td th:text="${e.autor}"></td>
            <td th:text="${#temporals.format(e.fechaPublicacion, 'dd/MM/yyyy')}"></td>
            <td class="text-end">
              <div class="d-flex justify-content-end gap-1">
                <a class="btn btn-outline-dark btn-sm rounded-circle p-2" th:href="@{'/admin/eventos/editar/' + ${e.id}}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                </a>
                <a class="btn btn-outline-danger btn-sm rounded-circle p-2 btn-delete" th:href="@{'/admin/eventos/eliminar/' + ${e.id}}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </a>
              </div>
            </td>
          </tr>

          <tr th:if="${eventos == null or #lists.isEmpty(eventos)}">
            <td colspan="5" class="text-center py-5">
              <h5 class="fw-bold text-dark mb-2">Sin Publicaciones</h5>
              <p class="text-secondary mb-0">Comienza a redactar contenido para la comunidad.</p>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {

    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.has('exito')) {
      Swal.fire({
        icon: 'success',
        title: '¡Guardado!',
        text: 'La publicación ha sido guardada correctamente.',
        timer: 3000,
        showConfirmButton: false,
        customClass: { popup: 'rounded-4' }
      });
      window.history.replaceState({}, document.title, window.location.pathname);
    } else if (urlParams.has('eliminado')) {
      Swal.fire({
        icon: 'success',
        title: '¡Eliminado!',
        text: 'La publicación ha sido eliminada del sistema.',
        timer: 3000,
        showConfirmButton: false,
        customClass: { popup: 'rounded-4' }
      });
      window.history.replaceState({}, document.title, window.location.pathname);
    } else if (urlParams.has('error')) {
      Swal.fire({
        icon: 'error',
        title: '¡Error!',
        text: 'Hubo un problema al procesar la solicitud.',
        customClass: { popup: 'rounded-4' }
      });
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    const deleteButtons = document.querySelectorAll('.btn-delete');
    deleteButtons.forEach(button => {
      button.addEventListener('click', function(e) {
        e.preventDefault();
        const urlDestino = this.getAttribute('href');

        Swal.fire({
          title: '¿Eliminar Noticia?',
          text: "Esta acción no se puede deshacer y se borrará del portal público.",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#d33',
          cancelButtonColor: '#eaedf2',
          confirmButtonText: 'Sí, Eliminar',
          cancelButtonText: '<span style="color:#111">Cancelar</span>',
          customClass: { popup: 'rounded-4' }
        }).then((result) => {
          if (result.isConfirmed) {
            window.location.href = urlDestino;
          }
        });
      });
    });
  });
</script>
</body>
</html>
