<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tacna en Bici - Formulario de Noticia</title>
  <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/admin-layout.css}">

  <style>
    .card-widget {
      background-color: #ffffff;
      border: 1px solid #eaedf2;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
      max-width: 800px;
    }

    .form-control, .form-select {
      border-radius: 12px;
      padding: 14px 20px;
      border: 1px solid #eaedf2;
      background-color: #f8f9fa;
      font-size: 0.95rem;
    }

    .form-control:focus, .form-select:focus {
      box-shadow: none;
      border-color: #111;
      background-color: #fff;
    }

    .form-label {
      font-weight: 600;
      color: #333;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="dashboard-app">

  <div th:replace="~{fragments/admin-sidebar :: sidebar('eventos')}"></div>

  <main class="main-content">
    <header class="top-bar">
      <div>
        <h2 class="fw-bold fs-3 mb-1" th:text="${evento.id != null ? 'Editar Noticia' : 'Redactar Nueva Noticia'}">Redactar Noticia</h2>
        <p class="text-secondary small mb-0">Completa el formulario para publicar en el portal público</p>
      </div>

      <a th:href="@{/admin/eventos}" class="btn btn-outline-dark rounded-pill px-4 fw-semibold py-2">
        Cancelar
      </a>
    </header>

    <div class="card-widget">
      <form th:action="@{/admin/eventos/guardar}" th:object="${evento}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-4">
          <label class="form-label">Título Principal</label>
          <input type="text" class="form-control" th:field="*{titulo}" required placeholder="Ej. Nueva ciclovía inaugurada en Tacna">
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label">Categoría</label>
            <select class="form-select" th:field="*{categoria}" required>
              <option value="Comunidad">Comunidad</option>
              <option value="Rutas">Rutas</option>
              <option value="Seguridad">Seguridad</option>
              <option value="Talleres">Talleres</option>
              <option value="Eventos Públicos">Eventos Públicos</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">URL de Imagen Destacada</label>
            <input type="url" class="form-control" th:field="*{imagen}" placeholder="https://ejemplo.com/imagen.jpg">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Extracto Breve</label>
          <textarea class="form-control" th:field="*{extracto}" rows="3" required placeholder="Un resumen corto de la noticia..."></textarea>
        </div>

        <div class="mb-5">
          <label class="form-label">Contenido Completo</label>
          <textarea class="form-control" th:field="*{contenido}" rows="8" placeholder="Desarrollo completo de la noticia..."></textarea>
        </div>

        <button type="submit" class="btn btn-dark w-100 rounded-pill py-3 fw-bold fs-6" th:text="${evento.id != null ? 'Guardar Cambios' : 'Publicar Noticia'}">
          Publicar Noticia
        </button>

      </form>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
