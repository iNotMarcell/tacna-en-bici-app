<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reportar Avistamiento</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f7fa; color: #111; }
        .page-header-clean { padding: 120px 0 40px 0; text-align: center; }
        .page-title { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; }

        .card-widget { background-color: #ffffff; border: 1px solid #eaedf2; border-radius: 24px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); margin-bottom: 60px; }

        .form-control { border-radius: 14px; padding: 14px 20px; border: 1px solid #eaedf2; background-color: #f8f9fa; font-size: 0.95rem; }
        .form-control:focus { box-shadow: 0 0 0 4px rgba(17, 17, 17, 0.15); border-color: #111; background-color: #fff; }
        .form-label { font-weight: 600; color: #555; font-size: 0.85rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        #map-picker { width: 100%; height: 350px; border-radius: 16px; border: 2px solid #eaedf2; z-index: 1; }
        .map-helper { font-size: 0.85rem; color: #666; margin-top: 8px; display: flex; align-items: center; gap: 6px;}

        .bike-info-pill { background: #111; color: #fff; padding: 15px 25px; border-radius: 16px; display: inline-flex; align-items: center; gap: 15px; margin-bottom: 30px; }

        .navbar-pill .nav-link,
        .navbar-pill .navbar-brand,
        .navbar-pill .navbar-brand span,
        .navbar-pill .navbar-brand svg,
        .navbar-pill .navbar-brand i,
        .navbar-pill .text-white {
            color: #111111 !important;
        }
        .navbar-pill .nav-btn-outline {
            color: #111111 !important;
            border-color: rgba(0, 0, 0, 0.3) !important;
        }
        .navbar-pill .nav-btn-outline:hover {
            background-color: #111111 !important;
            color: #ffffff !important;
        }

        .btn-black-custom {
            background-color: #111111;
            border-color: #111111;
            color: #ffffff;
            transition: all 0.3s ease;
        }
        .btn-black-custom:hover {
            background-color: #333333 !important;
            border-color: #333333 !important;
            color: #ffffff !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-header-clean">
    <div class="container">
        <h1 class="page-title">Registrar Avistamiento</h1>
        <p class="text-secondary lead">Gracias por colaborar. Indica dónde y cuándo viste esta bicicleta.</p>
    </div>
</div>

<div class="container px-4 px-xl-5">
    <div class="row justify-content-center">
        <div class="col-lg-12 col-xl-10">

            <div class="card-widget">

                <div class="bike-info-pill w-100">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                    <div>
                        <div class="small text-white text-opacity-75">Bicicleta reportada</div>
                        <div class="fw-bold fs-5" th:text="${bicicleta.marca + ' ' + bicicleta.modelo}">Marca Modelo</div>
                    </div>
                </div>

                <form th:action="@{/avistamientos/guardar}" th:object="${avistamiento}" method="post" enctype="multipart/form-data">

                    <input type="hidden" name="bicicletaId" th:value="${bicicleta.id}">
                    <input type="hidden" id="latitud" name="latitud" value="0.0">
                    <input type="hidden" id="longitud" name="longitud" value="0.0">

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha del avistamiento</label>
                            <input type="date" class="form-control" th:field="*{fecha}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Hora aproximada</label>
                            <input type="time" class="form-control" th:field="*{hora}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark">Ubicación Exacta</label>
                        <div id="map-picker"></div>
                        <div class="map-helper">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            <strong>Haz clic en el mapa</strong> para colocar el pin en el lugar exacto donde viste la bicicleta.
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Dirección Escrita</label>
                            <input type="text" class="form-control" th:field="*{direccion}" placeholder="Ej. Av. España cuadra 4" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Punto de referencia</label>
                            <input type="text" class="form-control" th:field="*{referencia}" placeholder="Ej. Frente a la farmacia Inkafarma">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark">Evidencia Fotográfica (Opcional)</label>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="text-secondary small">Foto 1</label>
                                <input type="file" class="form-control" name="imagen1" accept="image/*">
                            </div>
                            <div class="col-md-6">
                                <label class="text-secondary small">Foto 2</label>
                                <input type="file" class="form-control" name="imagen2" accept="image/*">
                            </div>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="form-label">Detalles Adicionales</label>
                        <textarea rows="4" class="form-control" th:field="*{descripcion}" placeholder="¿Quién la tenía? ¿Hacia dónde iba? Cualquier detalle es útil..."></textarea>
                    </div>

                    <div class="d-flex gap-3 justify-content-end">
                        <a th:href="@{'/bicicletas/' + ${bicicleta.id}}" class="btn btn-outline-dark rounded-pill px-4 py-3 fw-semibold">Cancelar</a>
                        <button type="submit" class="btn btn-black-custom rounded-pill px-5 py-3 fw-bold">Guardar Avistamiento</button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {

        const map = L.map('map-picker').setView([-8.0894, -78.9616], 14);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        let marker = null;

        const latInput = document.getElementById('latitud');
        const lngInput = document.getElementById('longitud');

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            latInput.value = lat;
            lngInput.value = lng;

            if(marker) {
                marker.setLatLng(e.latlng);
            } else {
                const blackIcon = new L.Icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-black.png',
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                    iconSize: [25, 41], iconAnchor: [12, 41]
                });
                marker = L.marker(e.latlng, {icon: blackIcon}).addTo(map);
            }
        });
    });
</script>

</body>
</html>
