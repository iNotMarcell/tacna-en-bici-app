<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tacna en Bici - Reportar Bicicleta Robada</title>
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f7fa; margin: 0; padding: 0; color: #111; }
        .page-header { background: linear-gradient(135deg, #111111 0%, #1a1a1a 100%); padding: 120px 0 100px 0; border-radius: 0 0 40px 40px; margin-bottom: -50px; text-align: center; }
        .page-title { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; color: #ffffff; margin-bottom: 15px; }
        .card-widget { position: relative; z-index: 10; background-color: #ffffff; border: 1px solid #eaedf2; border-radius: 24px; padding: 50px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); margin-bottom: 60px; }
        .section-title { font-size: 1.25rem; font-weight: 700; color: #111; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid #eaedf2; }
        .section-icon { background: #f8f9fa; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #111; border: 1px solid #eaedf2; }
        .form-control, .form-select { border-radius: 14px; padding: 14px 20px; border: 1px solid #eaedf2; background-color: #f8f9fa; font-size: 0.95rem; transition: all 0.3s; color: #333; }
        .form-control:focus, .form-select:focus { box-shadow: 0 0 0 4px rgba(17,17,17,0.08); border-color: #111; background-color: #fff; }
        .form-control::placeholder { color: #adb5bd; }
        .form-label { font-weight: 600; color: #555; font-size: 0.85rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .file-upload-wrapper { position: relative; background: #f8f9fa; border: 2px dashed #eaedf2; border-radius: 16px; padding: 30px; text-align: center; transition: all 0.3s; }
        .file-upload-wrapper:hover { border-color: #111; background: #f1f3f5; }
        .file-upload-wrapper input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        #map-picker { width: 100%; height: 350px; border-radius: 16px; border: 2px solid #eaedf2; z-index: 1; }
        .map-helper { font-size: 0.85rem; color: #666; margin-top: 8px; display: flex; align-items: center; gap: 6px; }

        @media (max-width: 768px) {
            .card-widget { padding: 30px 20px; }
            .page-header { padding: 100px 20px 80px 20px; margin-bottom: -30px;}
            .page-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="page-header">
    <div class="container">
        <span class="badge bg-danger text-white rounded-pill px-3 py-2 mb-3 fw-medium tracking-wide shadow-sm" data-aos="fade-down">URGENTE</span>
        <h1 class="page-title" data-aos="fade-up" data-aos-delay="100">Reportar Bicicleta Robada</h1>
        <p class="text-white text-opacity-75 lead mx-auto" style="max-width: 600px;" data-aos="fade-up" data-aos-delay="200">
            Completa el siguiente formulario con la mayor cantidad de detalles posible.
        </p>
    </div>
</div>

<div class="container-fluid px-4 px-xl-5">
    <div class="row justify-content-center">
        <div class="col-12 col-xxl-11">

            <div class="card-widget" data-aos="fade-up" data-aos-delay="300">
                <form th:action="@{/bicicletas/guardar}" th:object="${bicicleta}" method="post" enctype="multipart/form-data" id="form-robo">

                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" id="latitud" th:field="*{latitud}">
                    <input type="hidden" id="longitud" th:field="*{longitud}">

                    <h4 class="section-title">
                        <div class="section-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"></path></svg>
                        </div>
                        Detalles de la Bicicleta
                    </h4>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Marca</label>
                            <input type="text" class="form-control" th:field="*{marca}" placeholder="Ej. Trek, Giant, Specialized..." required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Modelo</label>
                            <input type="text" class="form-control" th:field="*{modelo}" placeholder="Ej. Marlin 7" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Color Principal</label>
                            <input type="text" class="form-control" th:field="*{color}" placeholder="Ej. Negro con letras rojas" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Tipo de Bicicleta</label>
                            <select class="form-select" th:field="*{tipo}">
                                <option value="Montaña">Montaña (MTB)</option>
                                <option value="Ruta">Ruta / Pista</option>
                                <option value="Urbana">Urbana / Paseo</option>
                                <option value="BMX">BMX</option>
                                <option value="Eléctrica">Eléctrica</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Número de serie</label>
                            <input type="text" class="form-control" th:field="*{numeroSerie}" placeholder="Opcional pero recomendado">
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-12 mb-3">
                            <label class="form-label">Descripción General</label>
                            <textarea class="form-control" rows="3" th:field="*{descripcion}" placeholder="Añade detalles sobre el tamaño, tipo de llantas, accesorios instalados..."></textarea>
                        </div>
                        <div class="col-12 mb-4">
                            <label class="form-label">Características particulares (Marcas, Rasguños)</label>
                            <textarea class="form-control" rows="2" th:field="*{caracteristicasParticulares}" placeholder="Ej. Tiene un raspón en el lado derecho del marco..."></textarea>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Imágenes de la Bicicleta</label>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="text-secondary small">Imagen Principal (General)</label>
                                <input type="file" class="form-control" name="imagen" accept="image/*">
                            </div>
                            <div class="col-md-6">
                                <label class="text-secondary small">Detalle 1 (ej. Timón / Frenos)</label>
                                <input type="file" class="form-control" name="imagen2" accept="image/*">
                            </div>
                            <div class="col-md-6">
                                <label class="text-secondary small">Detalle 2 (ej. Llantas / Cuadro)</label>
                                <input type="file" class="form-control" name="imagen3" accept="image/*">
                            </div>
                            <div class="col-md-6">
                                <label class="text-secondary small">Detalle 3 (Señas particulares)</label>
                                <input type="file" class="form-control" name="imagen4" accept="image/*">
                            </div>
                        </div>
                    </div>

                    <h4 class="section-title mt-5 text-danger">
                        <div class="section-icon bg-danger bg-opacity-10 text-danger border-danger border-opacity-25">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        </div>
                        Información del Incidente
                    </h4>

                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <label class="form-label text-danger">Fecha del robo</label>
                            <input type="date" class="form-control border-danger border-opacity-25" th:field="*{fechaRobo}" id="fechaRobo" required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Departamento</label>
                            <select class="form-select" th:field="*{departamento}" id="cboDepartamento" th:data-selected="${bicicleta.departamento}" required>
                                <option value="">Seleccione Departamento</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Provincia</label>
                            <select class="form-select" th:field="*{provincia}" id="cboProvincia" th:data-selected="${bicicleta.provincia}" required disabled>
                                <option value="">Seleccione Provincia</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-5 mb-3">
                            <label class="form-label">Distrito</label>
                            <select class="form-select" th:field="*{distrito}" id="cboDistrito" th:data-selected="${bicicleta.distrito}" required disabled>
                                <option value="">Seleccione Distrito</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark">Ubicación Exacta en el Mapa</label>
                        <div id="map-picker"></div>
                        <div class="map-helper">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            <strong>Haz clic en el mapa</strong> para colocar el pin. La dirección se rellenará automáticamente.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Dirección exacta o lugar del robo</label>
                        <input type="text" class="form-control" th:field="*{lugarRobo}" id="lugarRobo" placeholder="Ej. Av. Bolognesi frente al mercado central" required>
                    </div>

                    <div class="row mb-4">
                        <div class="col-12 mb-3">
                            <label class="form-label">¿Cómo ocurrió el robo?</label>
                            <textarea class="form-control" rows="3" th:field="*{descripcionRobo}" placeholder="Describe brevemente cómo sucedieron los hechos..."></textarea>
                        </div>
                        <div class="col-md-5 mt-2">
                            <label class="form-label fw-bold">¿Existe denuncia policial?</label>
                            <select class="form-select" th:field="*{denunciaPolicial}">
                                <option th:value="true">Sí, ya realicé la denuncia</option>
                                <option th:value="false">No he realizado denuncia aún</option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-5 border-secondary border-opacity-25">

                    <div class="d-flex flex-column flex-md-row justify-content-end gap-3">
                        <a th:href="@{/bicicletas}" class="btn btn-outline-dark rounded-pill px-5 py-3 fw-semibold">Cancelar</a>
                        <button type="submit" class="btn btn-danger rounded-pill px-5 py-3 fw-bold d-flex align-items-center justify-content-center gap-2 shadow-sm">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                            Reportar Bicicleta
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/ubigeo.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        AOS.init({ once: true, offset: 20, duration: 700 });

        const cboDepartamento = document.getElementById('cboDepartamento');
        const cboProvincia = document.getElementById('cboProvincia');
        const cboDistrito = document.getElementById('cboDistrito');

        if (typeof ubigeoPeru !== 'undefined') {
            Object.keys(ubigeoPeru).sort().forEach(depto => {
                let option = document.createElement('option');
                option.value = depto;
                option.textContent = depto;
                cboDepartamento.appendChild(option);
            });

            cboDepartamento.addEventListener('change', function() {
                cboProvincia.innerHTML = '<option value="">Seleccione Provincia</option>';
                cboDistrito.innerHTML = '<option value="">Seleccione Distrito</option>';
                cboProvincia.disabled = true;
                cboDistrito.disabled = true;

                const depto = this.value;
                if (depto && ubigeoPeru[depto]) {
                    cboProvincia.disabled = false;
                    Object.keys(ubigeoPeru[depto]).sort().forEach(prov => {
                        let option = document.createElement('option');
                        option.value = prov;
                        option.textContent = prov;
                        cboProvincia.appendChild(option);
                    });
                }
            });

            cboProvincia.addEventListener('change', function() {
                cboDistrito.innerHTML = '<option value="">Seleccione Distrito</option>';
                cboDistrito.disabled = true;

                const depto = cboDepartamento.value;
                const prov = this.value;

                if (depto && prov && ubigeoPeru[depto][prov]) {
                    cboDistrito.disabled = false;
                    ubigeoPeru[depto][prov].sort().forEach(dist => {
                        let option = document.createElement('option');
                        option.value = dist;
                        option.textContent = dist;
                        cboDistrito.appendChild(option);
                    });
                }
            });

            const selDepto = cboDepartamento.getAttribute('data-selected');
            const selProv = cboProvincia.getAttribute('data-selected');
            const selDist = cboDistrito.getAttribute('data-selected');

            if (selDepto) {
                cboDepartamento.value = selDepto;
                cboDepartamento.dispatchEvent(new Event('change'));
                if (selProv) {
                    setTimeout(() => {
                        cboProvincia.value = selProv;
                        cboProvincia.dispatchEvent(new Event('change'));
                        if (selDist) {
                            setTimeout(() => { cboDistrito.value = selDist; }, 50);
                        }
                    }, 50);
                }
            }
        }

        const map = L.map('map-picker').setView([-8.0894, -78.9616], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        let marker = null;
        const latInput = document.getElementById('latitud');
        const lngInput = document.getElementById('longitud');
        const direccionInput = document.getElementById('lugarRobo');

        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });

        if (latInput.value && lngInput.value) {
            marker = L.marker([latInput.value, lngInput.value], {icon: redIcon}).addTo(map);
            map.setView([latInput.value, lngInput.value], 16);
        }

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;

            latInput.value = lat;
            lngInput.value = lng;

            if(marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng, {icon: redIcon}).addTo(map);
            }

            direccionInput.placeholder = "Buscando dirección...";

            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.display_name) {
                        let addressParts = [];
                        if (data.address.road) addressParts.push(data.address.road);
                        if (data.address.house_number) addressParts.push(data.address.house_number);

                        let finalAddress = addressParts.join(' ');
                        if (!finalAddress) finalAddress = data.display_name.split(',')[0];

                        direccionInput.value = finalAddress;
                    }
                })
                .catch(() => {
                    direccionInput.placeholder = "Escribe la dirección manualmente";
                });
        });

        const fechaRoboInput = document.getElementById('fechaRobo');
        if (fechaRoboInput) {
            const hoy = new Date();
            const year = hoy.getFullYear();
            const month = String(hoy.getMonth() + 1).padStart(2, '0');
            const day = String(hoy.getDate()).padStart(2, '0');
            fechaRoboInput.max = `${year}-${month}-${day}`;
        }

        const fileInput = document.querySelector('input[type="file"]');
        const fileText = document.querySelector('.file-upload-wrapper h6');
        if(fileInput && fileText) {
            fileInput.addEventListener('change', function(e) {
                if(e.target.files.length > 0) {
                    fileText.textContent = 'Archivo: ' + e.target.files[0].name;
                    fileText.classList.add('text-success');
                } else {
                    fileText.textContent = 'Haz clic para subir una foto';
                    fileText.classList.remove('text-success');
                }
            });
        }

        const form = document.getElementById("form-robo");
        if(form) {
            form.addEventListener("submit", function(e) {
                e.preventDefault();

                if (fechaRoboInput && fechaRoboInput.value) {
                    const selectedDate = new Date(fechaRoboInput.value + 'T00:00:00');
                    const currentDate = new Date();
                    currentDate.setHours(0,0,0,0);
                    if (selectedDate > currentDate) {
                        Swal.fire({
                            icon: 'warning',
                            title: 'Fecha inválida',
                            text: 'La fecha del robo no puede ser futura.',
                            customClass: { popup: 'rounded-4' }
                        });
                        return;
                    }
                }

                const formData = new FormData(form);

                Swal.fire({
                    title: 'Enviando reporte...',
                    text: 'Por favor, espere.',
                    allowOutsideClick: false,
                    customClass: { popup: 'rounded-4' },
                    didOpen: () => { Swal.showLoading(); }
                });

                fetch(form.action, {
                    method: 'POST',
                    body: formData
                })
                    .then(response => {
                        if (response.ok || response.redirected) {
                            Swal.fire({
                                icon: 'success',
                                title: '¡Enviado!',
                                text: 'Reporte registrado correctamente.',
                                timer: 3000,
                                showConfirmButton: false,
                                customClass: { popup: 'rounded-4' }
                            }).then(() => {
                                window.location.href = '/bicicletas';
                            });
                        } else {
                            Swal.fire({
                                icon: 'error',
                                title: 'Error',
                                text: 'Verifica los datos.',
                                customClass: { popup: 'rounded-4' }
                            });
                        }
                    })
                    .catch(() => {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error de red',
                            text: 'Fallo de conexión.',
                            customClass: { popup: 'rounded-4' }
                        });
                    });
            });
        }
    });

    document.addEventListener("DOMContentLoaded", function() {
        const navbar = document.querySelector('.navbar-pill');

        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                navbar.classList.add('scrolled-nav');
            } else {
                navbar.classList.remove('scrolled-nav');
            }
        });
    });
</script>

</body>
</html>
